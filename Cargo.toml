[workspace]
resolver = "2"
members = [
    "npu-forge",
    "copyflow-core",
    "android-bridge",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["CopyFlow Team"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
zip = { version = "2.1", default-features = false, features = ["deflate"] }
quick-xml = { version = "0.36", features = ["serialize"] }
ttf-parser = "0.24"
sha2 = "0.10"
jni = "0.21"
once_cell = "1.19"

